<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Back cover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#c8ff3d}a:hover{color:#fafaf8}
</style>
</helmet>
<div style="width: 840px; height: 1188px; box-sizing: border-box; padding: 34px 40px 30px; background: #161816; color: #fafaf8; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #d6d6d0">
<span>Sotabosc · Barcelona Edition</span><span>No. 0 — December 2026</span>
</div>

<svg viewBox="0 0 760 640" width="760" height="640" style="display: block" aria-hidden="true">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="200">
<rect x="{{m.x}}" y="{{m.y}}" width="{{m.w}}" height="{{m.w}}" fill="{{m.fill}}" stroke="{{m.stroke}}" stroke-width="1.1" transform="{{m.t}}"></rect>
</sc-for>
</svg>

<p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 74px; line-height: .9; letter-spacing: -.02em">Culture, art and creative life — <span style="font-style: italic; color: #c8ff3d">wherever you are.</span></p>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; border-top: 1px solid rgba(250,250,248,.35); padding-top: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #c8ff3d">Read</span>
<span style="font-size: 12.5px; line-height: 1.45">The edition, every day, at sotabosc.world</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #c8ff3d">Watch</span>
<span style="font-size: 12.5px; line-height: 1.45">Sotabosc TV, in the places that host it</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #c8ff3d">Next issue</span>
<span style="font-size: 12.5px; line-height: 1.45">No. 1, January 2027</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":1188}}'>
class Component extends DCLogic {
  renderVals() {
    var seed = 11;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var out = [], cols = 20, rows = 16, cw = 760 / cols, rh = 640 / rows, size = cw * 0.6;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var d = Math.min(1, Math.hypot(c - 14, r - 5) / 9);
        var chaos = 1 - d;
        var cx = c * cw + cw / 2 + (rnd() - 0.5) * 22 * chaos;
        var cy = r * rh + rh / 2 + (rnd() - 0.5) * 22 * chaos;
        var a = (rnd() - 0.5) * 120 * chaos;
        var lime = chaos > 0.7 && rnd() > 0.6;
        out.push({
          x: (cx - size / 2).toFixed(1), y: (cy - size / 2).toFixed(1), w: size.toFixed(1),
          fill: lime ? '#c8ff3d' : 'none', stroke: lime ? '#c8ff3d' : 'rgba(250,250,248,0.55)',
          t: 'rotate(' + a.toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')'
        });
      }
    }
    return { marks: out };
  }
}
</script>
</body>
</html>
